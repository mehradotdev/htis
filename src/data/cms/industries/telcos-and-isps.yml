shortTitle: Telecom
summary: Network providers and ISPs
heroSubtitle: Powering national-scale connectivity with high-capacity optical backhaul, virtualized cores, and robust active/passive infrastructure.
iconName: RadioTower
techStack:
  - 5G Standalone (SA)
  - SRv6 Segment Routing
