journey:
  titlePrefix: Our
  titleHighlight: Journey
  subtitle: A timeline of innovation, milestones, and achievements that shaped our
    path forward.
  milestones:
    - year: "2008"
      title: HTIS Founded
      description: Established Horizon Telecom Infrastructure Services and secured
        initial telecom infrastructure projects with Vodafone and Bharti.
      image: src/assets/untitled-22-june-2026-at-151852-2.png
    - year: "2010"
      title: Major Telecom Customer Expansion
      description: >
        Added major telecom customers including Idea Cellular and Ericsson,
        strengthening HTIS's position as a trusted telecom deployment partner.
      image: src/assets/geminigeneratedimageno004jno004jno00.png
    - year: "2012"
      title: HTIS Telecom Pvt. Ltd. Incorporated
      description: The company was formally incorporated as HTIS Telecom Private
        Limited, creating a strong foundation for structured growth and
        nationwide expansion.
      image: src/assets/geminigeneratedimage8k8gkr8k8gkr8k8g.png
    - year: "2013"
      title: Cisco Service Partner
      description: Empanelled as a Cisco Service Partner, enabling HTIS to participate
        in large-scale enterprise networking and service provider projects.
      image: src/assets/geminigeneratedimage7ijrrl7ijrrl7ijr.png
    - year: "2014"
      title: Jio 4G Rollout Program
      description: Played a key role in the Jio 4G rollout across North and West
        India, supporting large-scale network deployments and infrastructure
        implementation.
      image: src/assets/geminigeneratedimagew05k6fw05k6fw05k.png
    - year: "2017"
      title: Cisco Global Partnership
      description: Signed a Global PSSA agreement with Cisco as a niche category
        partner in the Service Provider domain, reinforcing HTIS's technical
        expertise and delivery capabilities.
      image: src/assets/chatgpt-image-jun-24-2026-103047-am.png
    - year: "2017"
      title: International Expansion
      description: Expanded operations beyond India to support projects in Sri Lanka,
        Bangladesh, South Africa, and other international markets.
      image: src/assets/geminigeneratedimagexq8lrxq8lrxq8lrx.png
    - year: "2018"
      title: WFMS Foundation
      description: Initiated development of HTIS Workforce Management System (WFMS),
        an enterprise platform designed to digitize workforce, project, and
        operational management.
      image: src/assets/our-journey-8.png
    - year: "2018"
      title: NTT Data UK Partnership
      description: Partnered with NTT Data UK and deployed dedicated resources in
        London to support telecom testing and network service programs.
      image: src/assets/our-journey-9.png
    - year: "2019"
      title: United Nations Peacekeeping Project
      description: Successfully delivered critical infrastructure solutions for a
        United Nations Peacekeeping Mission in the Central African Republic in
        collaboration with Cisco.
      image: src/assets/our-journey-1.png
    - year: "2020"
      title: System Integration (SI) Business Launch
      description: Recognizing the accelerating digital transformation landscape, HTIS
        expanded into System Integration and IT Infrastructure solutions,
        establishing dedicated sales and delivery teams across North India.
      image: src/assets/our-journey-2.png
    - year: "2021"
      title: ₹100 Crore Business Milestone
      description: Within a year of entering the System Integration business, HTIS
        surpassed ₹100 Crore in annual business turnover, validating its
        strategic diversification.
      image: src/assets/our-journey-3.png
    - year: "2021"
      title: 400+ NHM Health Centres Digitized
      description: Enabled digital infrastructure deployment across 400+ NHM Primary
        Health Centres in Himachal Pradesh during the COVID-19 pandemic,
        supporting healthcare modernization and uninterrupted delivery of
        critical public health services.
      image: src/assets/our-journey-4.png
    - year: "2021"
      title: Employee Development Initiative (OBT)
      description: Launched the annual Outbound Training (OBT) program to strengthen
        leadership, collaboration, employee engagement, and organizational
        culture.
      image: src/assets/our-journey-5.png
    - year: "2022"
      title: Dell Titanium Partner
      description: Achieved Dell Titanium Partner accreditation, one of the highest
        levels of recognition within Dell's partner ecosystem.
      image: src/assets/our-journey-6.png
    - year: 2022-24
      title: Jio 5G Swap Program
      description: Contributed as a key partner in Jio's nationwide 5G Swap Program,
        supporting deployment and modernization across thousands of telecom
        sites throughout India.
      image: src/assets/our-journey-7.png
    - year: "2024"
      title: 5000+ Smart Classrooms
      description: Implemented over 5,000 Smart Classroom solutions across Himachal
        Pradesh by combining Samsung interactive hardware with HTIS-developed
        learning management technology.
      image: src/assets/our-journey-8.png
    - year: "2024"
      title: Industry Recognition
      description: Received prestigious recognition from Samsung and Cisco ecosystem
        partners for excellence in project execution, innovation, and customer
        success.
      image: src/assets/our-journey-9.png
    - year: "2025"
      title: Environment Health and Safety (EHS) Recognition
      description: " Invited for safety show case to Vodafone Inc -Cisco global summit."
      image: src/assets/our-journey-1.png
    - year: "2026"
      title: WFMS 2.0 AI Launch
      description: Launching the next generation of WFMS with AI-powered automation,
        predictive analytics, intelligent workforce management, and enhanced
        decision support capabilities.
      image: src/assets/gettyimages-2094337676-612x612.jpg
