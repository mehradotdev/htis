media:
  input: src/assets
  output: src/assets
  extensions: [png, jpg, jpeg, webp, svg]
  rename: safe

content:
  - name: settings
    label: Settings
    type: group
    items:
      - name: site
        label: Site
        type: file
        path: src/data/cms/site.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: defaultTitle
            label: Default title
            type: string
            required: true
          - name: language
            type: string
            required: true
          - name: theme
            type: string
            required: true
          - name: darkTheme
            type: string
            required: true
          - name: favicon
            type: string
            required: true
          - name: contactAnchor
            label: Contact anchor
            type: string
            required: true

      - name: navigation
        label: Navigation
        type: file
        path: src/data/cms/navigation.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: logo
            type: object
            fields:
              - name: image
                type: image
                required: true
              - name: alt
                type: string
                required: true
          - name: primary
            type: object
            fields:
              - name: home
                type: object
                fields: &nav_link_fields
                  - name: title
                    type: string
                    required: true
                  - name: url
                    type: string
                    required: true
              - name: career
                type: object
                fields: *nav_link_fields
              - name: contact
                type: object
                fields: *nav_link_fields
          - name: solutions
            type: object
            fields: &nav_group_fields
              - name: label
                type: string
                required: true
              - name: heading
                type: string
                required: true
              - name: card
                type: object
                fields:
                  - name: image
                    type: image
                    required: true
                  - name: alt
                    type: string
                    required: true
                  - name: title
                    type: string
                    required: true
                  - name: description
                    type: text
                    required: true
                  - name: ctaLabel
                    label: CTA label
                    type: string
                    required: true
                  - name: ctaUrl
                    label: CTA URL
                    type: string
                    required: true
              - name: items
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{title}'
                fields: &nav_item_fields
                  - name: title
                    type: string
                    required: true
                  - name: desc
                    label: Description
                    type: text
                    required: true
                  - name: url
                    type: string
                    required: true
                  - name: icon
                    type: select
                    required: true
                    options:
                      values:
                        [
                          ArrowRight,
                          Award,
                          Briefcase,
                          Building2,
                          Code,
                          Factory,
                          HardHat,
                          HeartPulse,
                          Info,
                          Landmark,
                          Phone,
                          RadioTower,
                          Server,
                          Users,
                        ]
          - name: industries
            type: object
            fields:
              - name: label
                type: string
                required: true
              - name: heading
                type: string
                required: true
              - name: viewAll
                label: View all item
                type: object
                fields: *nav_item_fields
          - name: resources
            type: object
            fields: *nav_group_fields

      - name: footer
        label: Footer
        type: file
        path: src/data/cms/footer.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: logo
            type: object
            fields:
              - name: image
                type: image
                required: true
              - name: alt
                type: string
                required: true
          - name: description
            type: text
            required: true
          - name: sections
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{heading}'
            fields:
              - name: heading
                type: string
                required: true
              - name: links
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{label}'
                fields: &footer_link_fields
                  - name: label
                    type: string
                    required: true
                  - name: url
                    type: string
                    required: true
          - name: socials
            type: object
            fields:
              - name: heading
                type: string
                required: true
              - name: links
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{label}'
                fields:
                  - name: label
                    type: string
                    required: true
                  - name: url
                    type: string
                    required: true
                  - name: icon
                    type: select
                    required: true
                    options:
                      values: [Twitter, Instagram, LinkedIn]
          - name: contact
            type: object
            fields:
              - name: heading
                type: string
                required: true
              - name: phone
                type: string
                required: true
              - name: email
                type: string
                required: true
          - name: copyright
            type: string
            required: true
          - name: legalLinks
            label: Legal links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{label}'
            fields: *footer_link_fields

  - name: pages
    label: Pages
    type: group
    items:
      - name: home
        label: Home
        type: file
        path: src/data/cms/home.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: hero
            type: object
            fields:
              - name: backgroundImage
                label: Background image
                type: image
                required: true
              - name: titlePrefix
                label: Title prefix
                type: string
                required: true
              - name: rotatingWords
                label: Rotating words
                type: string
                list: true
                required: true
              - name: subtitle
                type: text
                required: true
              - name: ctaLabel
                label: CTA label
                type: string
                required: true
              - name: ctaUrl
                label: CTA URL
                type: string
                required: true
              - name: trustedByLabel
                label: Trusted by label
                type: string
                required: true
              - name: partnerLogos
                label: Partner logos
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{alt}'
                fields:
                  - name: image
                    type: image
                    required: true
                  - name: alt
                    type: string
                    required: true
          - name: journey
            type: object
            fields:
              - name: titlePrefix
                type: string
                required: true
              - name: titleHighlight
                type: string
                required: true
              - name: subtitle
                type: text
                required: true
              - name: images
                type: image
                list: true
                required: true
              - name: milestones
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{year} - {title}'
                fields: &milestone_fields
                  - name: year
                    type: string
                    required: true
                  - name: title
                    type: string
                    required: true
                  - name: description
                    type: text
                    required: true
          - name: team
            type: object
            fields:
              - name: backgroundImage
                type: image
                required: true
              - name: meetTeamImage
                type: image
                required: true
              - name: heading
                type: string
                required: true
              - name: description
                type: text
                required: true
              - name: ctaTitle
                type: string
                required: true
              - name: ctaLabel
                type: string
                required: true
              - name: ctaUrl
                type: string
                required: true
              - name: members
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{name}'
                fields:
                  - name: name
                    type: string
                    required: true
                  - name: role
                    type: string
                    required: true
                  - name: desc
                    type: text
                    required: true
                  - name: image
                    type: image
                    required: true

      - name: industries
        label: Industries
        type: collection
        path: src/data/cms/industries
        format: yaml
        filename:
          template: '{slug}.yml'
          field: create
        view:
          primary: title
          fields: [title, slug, shortTitle]
          sort: [title, slug]
        fields:
          - name: slug
            type: string
            required: true
            pattern:
              regex: '^[a-z0-9-]+$'
              message: Use lowercase letters, numbers, and hyphens only.
          - name: title
            type: string
            required: true
          - name: shortTitle
            type: string
            required: true
          - name: summary
            type: text
            required: true
          - name: heroSubtitle
            type: text
            required: true
          - name: iconName
            label: Icon
            type: select
            required: true
            options:
              values: [Building2, Factory, HardHat, HeartPulse, Landmark, RadioTower]
          - name: techStack
            label: Tech stack
            type: string
            list: true
            required: true
          - name: challenges
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{title}'
            fields:
              - name: title
                type: string
                required: true
              - name: description
                type: text
                required: true
          - name: capabilities
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{title}'
            fields:
              - name: title
                type: string
                required: true
              - name: description
                type: text
                required: true
              - name: bulletPoints
                label: Bullet points
                type: string
                list: true
                required: true

      - name: telecom
        label: Telecom
        type: file
        path: src/data/cms/telecom.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: hero
            type: object
            fields: &split_hero_fields
              - name: backgroundImage
                label: Background image
                type: image
                required: true
              - name: foregroundImage
                label: Foreground image
                type: image
                required: false
              - name: title
                type: text
                required: true
              - name: highlight
                type: string
                required: false
              - name: subtitle
                type: text
                required: true
              - name: ctaLabel
                label: CTA label
                type: string
                required: true
              - name: ctaUrl
                label: CTA URL
                type: string
                required: true
              - name: secondaryCtaLabel
                label: Secondary CTA label
                type: string
                required: false
              - name: secondaryCtaUrl
                label: Secondary CTA URL
                type: string
                required: false
              - name: carouselImages
                label: Carousel images
                type: image
                list: true
                required: false
          - name: capabilities
            type: object
            fields:
              - name: backgroundImage
                label: Background image
                type: image
                required: true
              - name: heading
                type: string
                required: true
              - name: description
                type: text
                required: true
              - name: images
                type: image
                list: true
                required: true

      - name: systemIntegration
        label: System Integration
        type: file
        path: src/data/cms/system-integration.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: hero
            type: object
            fields: *split_hero_fields
          - name: strategicPillars
            label: Strategic pillars
            type: object
            fields:
              - name: backgroundImage
                type: image
                required: true
              - name: centerImage
                type: image
                required: true
              - name: heading
                type: string
                required: true
          - name: partnerEcosystem
            label: Partner ecosystem
            type: object
            fields:
              - name: tabs
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{title}'
                fields: &partner_tab_fields
                  - name: title
                    type: string
                    required: true
                  - name: subtitle
                    type: string
                    required: true
                  - name: description
                    type: text
                    required: true
                  - name: partners
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: '{name}'
                    fields:
                      - name: name
                        type: string
                        required: true
                      - name: logo
                        type: image
                        required: false
          - name: execution
            type: object
            fields: &execution_fields
              - name: heading
                type: text
                required: true
              - name: pillars
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{title}'
                fields:
                  - name: iconName
                    label: Icon
                    type: select
                    required: true
                    options:
                      values: [Code, Network, RadioTower, Server, Users]
                  - name: title
                    type: text
                    required: true
                  - name: description
                    type: text
                    required: true
                  - name: url
                    type: string
                    required: false
                  - name: ariaLabel
                    label: ARIA label
                    type: string
                    required: false
          - name: deployments
            type: object
            fields:
              - name: heading
                type: string
                required: true
              - name: image
                type: image
                required: true
              - name: imageAlt
                label: Image alt
                type: string
                required: true
              - name: featured
                type: object
                fields: &case_study_fields
                  - name: title
                    type: string
                    required: true
                  - name: description
                    type: text
                    required: false
                  - name: ctaLabel
                    label: CTA label
                    type: string
                    required: true
                  - name: ctaUrl
                    label: CTA URL
                    type: string
                    required: true
              - name: items
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{title}'
                fields: *case_study_fields

      - name: software
        label: Software
        type: file
        path: src/data/cms/software.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: hero
            type: object
            fields: *split_hero_fields
          - name: portfolio
            type: object
            fields:
              - name: backgroundImage
                type: image
                required: true
              - name: heading
                type: string
                required: true
              - name: description
                type: text
                required: true
              - name: saasImages
                label: SaaS images
                type: image
                list: true
                required: true
              - name: enterpriseImages
                label: Enterprise images
                type: image
                list: true
                required: true
              - name: publicImages
                label: Public-sector images
                type: image
                list: true
                required: true
          - name: execution
            type: object
            fields: *execution_fields
          - name: caseStudyImages
            label: Case study images
            type: image
            list: true
            required: true

      - name: resourcing
        label: Resourcing
        type: file
        path: src/data/cms/resourcing.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: hero
            type: object
            fields: *split_hero_fields
          - name: capabilities
            type: object
            fields:
              - name: backgroundImage
                type: image
                required: true
              - name: heading
                type: string
                required: true
              - name: description
                type: text
                required: true
              - name: items
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{title}'
                fields:
                  - name: iconName
                    label: Icon
                    type: select
                    required: true
                    options:
                      values:
                        [
                          Briefcase,
                          Cctv,
                          Cloud,
                          Monitor,
                          Network,
                          Server,
                          ShieldCheck,
                          UserPlus,
                        ]
                  - name: title
                    type: string
                    required: true
                  - name: desc
                    label: Description
                    type: text
                    required: true
                  - name: colSpan
                    label: Span two desktop columns
                    type: boolean
                    required: false
