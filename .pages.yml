media:
  input: src/assets
  output: src/assets
  extensions: [png, jpg, jpeg, webp, svg]
  rename: safe

content:
  - name: settings
    label: Settings
    type: group
    items:
      - name: site
        label: Site
        type: file
        path: src/data/cms/site.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: defaultTitle
            label: Default title
            type: string
            required: true
          - name: language
            type: string
            required: true
          - name: theme
            type: string
            required: true
          - name: darkTheme
            type: string
            required: true
          - name: favicon
            type: string
            required: true
          - name: contactAnchor
            label: Contact anchor
            type: string
            required: true

      - name: navigation
        label: Navigation
        type: file
        path: src/data/cms/navigation.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: logo
            type: object
            fields:
              - name: image
                type: image
                required: true
              - name: alt
                type: string
                required: true
          - name: primary
            type: object
            fields:
              - name: home
                type: object
                fields: &nav_link_fields
                  - name: title
                    type: string
                    required: true
                  - name: url
                    type: string
                    required: true
              - name: career
                type: object
                fields: *nav_link_fields
              - name: contact
                type: object
                fields: *nav_link_fields
          - name: solutions
            type: object
            fields: &nav_group_fields
              - name: label
                type: string
                required: true
              - name: heading
                type: string
                required: true
              - name: card
                type: object
                fields:
                  - name: image
                    type: image
                    required: true
                  - name: alt
                    type: string
                    required: true
                  - name: title
                    type: string
                    required: true
                  - name: description
                    type: text
                    required: true
                  - name: ctaLabel
                    label: CTA label
                    type: string
                    required: true
                  - name: ctaUrl
                    label: CTA URL
                    type: string
                    required: true
              - name: items
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{title}'
                fields: &nav_item_fields
                  - name: title
                    type: string
                    required: true
                  - name: desc
                    label: Description
                    type: text
                    required: true
                  - name: url
                    type: string
                    required: true
                  - name: icon
                    type: select
                    required: true
                    options:
                      values:
                        [
                          ArrowRight,
                          Award,
                          Briefcase,
                          Building2,
                          Code,
                          Factory,
                          HardHat,
                          HeartPulse,
                          Info,
                          Landmark,
                          Phone,
                          RadioTower,
                          Server,
                          Users,
                        ]
          - name: industries
            type: object
            fields:
              - name: label
                type: string
                required: true
              - name: heading
                type: string
                required: true
              - name: viewAll
                label: View all item
                type: object
                fields: *nav_item_fields
          - name: resources
            type: object
            fields: *nav_group_fields

      - name: contactForm
        label: Contact form
        type: file
        path: src/data/cms/contact-form.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: postUrl
            label: POST API call URL
            type: string
            required: true
          - name: categories
            label: Dropdown menu options
            type: string
            list: true
            required: true

      - name: footer
        label: Footer
        type: file
        path: src/data/cms/footer.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: logo
            type: object
            fields:
              - name: image
                type: image
                required: true
              - name: alt
                type: string
                required: true
          - name: description
            type: text
            required: true
          - name: sections
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{heading}'
            fields:
              - name: heading
                type: string
                required: true
              - name: links
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{label}'
                fields: &footer_link_fields
                  - name: label
                    type: string
                    required: true
                  - name: url
                    type: string
                    required: true
          - name: socials
            type: object
            fields:
              - name: heading
                type: string
                required: true
              - name: links
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{label}'
                fields:
                  - name: label
                    type: string
                    required: true
                  - name: url
                    type: string
                    required: true
                  - name: icon
                    type: select
                    required: true
                    options:
                      values: [Twitter, Instagram, LinkedIn]
          - name: contact
            type: object
            fields:
              - name: heading
                type: string
                required: true
              - name: phone
                type: string
                required: true
              - name: email
                type: string
                required: true
          - name: copyright
            type: string
            required: true
          - name: legalLinks
            label: Legal links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{label}'
            fields: *footer_link_fields

  - name: pages
    label: Pages
    type: group
    items:
      - name: home
        label: Home
        type: file
        path: src/data/cms/home.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: hero
            type: object
            fields:
              - name: backgroundImage
                label: Background image
                type: image
                required: true
              - name: titlePrefix
                label: Title prefix
                type: string
                required: true
              - name: rotatingWords
                label: Rotating words
                type: string
                list: true
                required: true
              - name: subtitle
                type: text
                required: true
              - name: ctaLabel
                label: CTA label
                type: string
                required: true
              - name: ctaUrl
                label: CTA URL
                type: string
                required: true
              - name: trustedByLabel
                label: Trusted by label
                type: string
                required: true
              - name: partnerLogos
                label: Partner logos
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{alt}'
                fields:
                  - name: image
                    type: image
                    required: true
                  - name: alt
                    type: string
                    required: true
          - name: services
            type: object
            fields:
              - name: headingHtml
                label: Heading HTML
                type: string
                required: true
              - name: items
                label: Services
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{id}'
                fields:
                  - name: id
                    type: select
                    required: true
                    options:
                      values: [telecom, resourcing, software, system]
                  - name: titleHtml
                    label: Title HTML
                    type: string
                    required: true
                  - name: href
                    label: Link URL
                    type: string
                    required: true
                  - name: features
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: '{label}'
                    fields:
                      - name: iconName
                        label: Icon (theme-colored SVG)
                        type: select
                        required: true
                        options:
                          values:
                            [
                              Blocks,
                              Building2,
                              Cable,
                              CheckSquare,
                              CircleDollarSign,
                              Clock,
                              Cloud,
                              Code,
                              Cpu,
                              Database,
                              FileSignature,
                              Headset,
                              Monitor,
                              Network,
                              Radio,
                              RefreshCw,
                              Server,
                              Shield,
                              ShieldCheck,
                              Smartphone,
                              UserSearch,
                              Users,
                              Wifi,
                              Wrench,
                            ]
                      - name: label
                        type: string
                        required: true
                      - name: description
                        type: text
                        required: true
                  - name: metrics
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: '{value} - {label}'
                    fields:
                      - name: value
                        type: string
                        required: true
                      - name: label
                        type: string
                        required: true
          - name: journey
            type: object
            fields:
              - name: titlePrefix
                type: string
                required: true
              - name: titleHighlight
                type: string
                required: true
              - name: subtitle
                type: text
                required: true
              - name: milestones
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{year} - {title}'
                fields: &milestone_fields
                  - name: year
                    type: string
                    required: true
                  - name: title
                    type: string
                    required: true
                  - name: description
                    type: text
                    required: true
                  - name: image
                    type: image
                    required: true
          - name: team
            type: object
            fields:
              - name: backgroundImage
                type: image
                required: true
              - name: meetTeamImage
                type: image
                required: true
              - name: heading
                type: string
                required: true
              - name: description
                type: text
                required: true
              - name: ctaTitle
                type: string
                required: true
              - name: ctaLabel
                type: string
                required: true
              - name: ctaUrl
                type: string
                required: true
              - name: members
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{name}'
                fields:
                  - name: name
                    type: string
                    required: true
                  - name: role
                    type: string
                    required: true
                  - name: desc
                    type: text
                    required: true
                  - name: image
                    type: image
                    required: true
          - name: footprint
            type: object
            fields:
              - name: heading
                type: string
                required: true
              - name: metrics
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{value}{suffix} - {label}'
                fields:
                  - name: value
                    type: string
                    required: true
                  - name: suffix
                    type: string
                    required: false
                  - name: label
                    type: string
                    required: true
              - name: globe
                type: object
                fields:
                  - name: ariaLabel
                    label: ARIA label
                    type: string
                    required: true
                  - name: markers
                    label: Globe markers
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: '{name}'
                    fields:
                      - name: name
                        type: string
                        required: true
                      - name: latitude
                        type: number
                        required: true
                      - name: longitude
                        type: number
                        required: true
                      - name: size
                        label: Marker size
                        type: number
                        required: true
          - name: clients
            type: object
            fields:
              - name: heading
                type: string
                required: true
              - name: ctaUrl
                label: CTA URL
                type: string
                required: true
              - name: ctaLabel
                label: CTA label
                type: string
                required: true
              - name: logos
                label: Client logos
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{alt}'
                fields:
                  - name: image
                    type: image
                    required: true
                  - name: alt
                    type: string
                    required: true
          - name: testimonials
            type: object
            fields:
              - name: headingPrefix
                label: Heading prefix
                type: string
                required: true
              - name: clientsHighlight
                label: Clients highlight
                type: string
                required: true
              - name: headingMiddle
                label: Heading middle
                type: string
                required: true
              - name: awardsHighlight
                label: Awards highlight
                type: string
                required: true
              - name: headingSuffix
                label: Heading suffix
                type: string
                required: true
              - name: ctaUrl
                label: CTA URL
                type: string
                required: true
              - name: ctaLabel
                label: CTA label
                type: string
                required: true
              - name: awardsImage
                label: Awards image
                type: image
                required: true
              - name: awardsImageAlt
                label: Awards image alt
                type: string
                required: true
              - name: items
                label: Testimonials
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{name} - {title}'
                fields:
                  - name: quote
                    type: text
                    required: true
                  - name: name
                    type: string
                    required: true
                  - name: title
                    type: string
                    required: true
          - name: articles
            type: object
            fields:
              - name: eyebrow
                type: string
                required: true
              - name: heading
                type: string
                required: true
              - name: ctaLabel
                label: CTA label
                type: string
                required: true
              - name: ctaUrl
                label: CTA URL
                type: string
                required: true
              - name: posts
                label: LinkedIn posts
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{fallbackTitle}'
                fields:
                  - name: embedCode
                    label: LinkedIn iframe embed code
                    type: text
                    required: true
                  - name: fallbackTitle
                    label: Fallback title
                    type: text
                    required: false

      - name: about
        label: About
        type: file
        path: src/data/cms/about.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: hero
            type: object
            fields:
              - name: backgroundImage
                label: Background image
                type: image
                required: true
              - name: title
                type: string
                required: true
              - name: highlight
                type: string
                required: true
              - name: subtitle
                type: text
                required: true
              - name: ctaLabel
                label: CTA label
                type: string
                required: true
              - name: ctaUrl
                label: CTA URL
                type: string
                required: true
          - name: mission
            label: Mission section
            type: object
            fields:
              - name: image
                type: image
                required: true
              - name: imageAlt
                label: Image alt
                type: string
                required: true
              - name: cards
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{title}'
                fields:
                  - name: title
                    type: string
                    required: true
                  - name: description
                    type: text
                    required: true
          - name: lifeAtHtis
            label: Life at HTIS
            type: object
            fields:
              - name: backgroundImage
                label: Background image
                type: image
                required: true
              - name: image
                type: image
                required: true
              - name: imageAlt
                label: Image alt
                type: string
                required: true
              - name: title
                type: string
                required: true
              - name: highlight
                type: string
                required: true
              - name: body
                type: text
                list: true
                required: true
              - name: ctaLabel
                label: CTA label
                type: string
                required: true
              - name: ctaUrl
                label: CTA URL
                type: string
                required: true
          - name: team
            type: object
            fields:
              - name: members
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{name}'
                fields:
                  - name: name
                    type: string
                    required: true
                  - name: role
                    type: string
                    required: true
                  - name: dept
                    label: Department
                    type: string
                    required: true
                  - name: image
                    type: image
                    required: true
          - name: principles
            type: object
            fields:
              - name: image
                type: image
                required: true
              - name: imageAlt
                label: Image alt
                type: string
                required: true
              - name: title
                type: string
                required: true
              - name: highlight
                type: string
                required: true
              - name: description
                type: text
                required: true
              - name: items
                type: string
                list: true
                required: true

      - name: awards
        label: Awards
        type: file
        path: src/data/cms/awards.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: hero
            type: object
            fields:
              - name: backgroundImage
                label: Background image
                type: image
                required: true
              - name: title
                type: string
                required: true
              - name: subtitle
                type: text
                required: true
          - name: items
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{title}'
            fields:
              - name: type
                type: select
                required: true
                options:
                  values: [award, certificate]
              - name: title
                type: string
                required: true
              - name: organization
                type: string
                required: true
              - name: date
                type: string
                required: true
              - name: image
                type: image
                required: true

      - name: telecom
        label: Telecom
        type: file
        path: src/data/cms/telecom.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: hero
            type: object
            fields: &split_hero_fields
              - name: backgroundImage
                label: Background image
                type: image
                required: true
              - name: foregroundImage
                label: Foreground image
                type: image
                required: false
              - name: title
                type: text
                required: true
              - name: highlight
                type: string
                required: false
              - name: subtitle
                type: text
                required: true
              - name: ctaLabel
                label: CTA label
                type: string
                required: true
              - name: ctaUrl
                label: CTA URL
                type: string
                required: true
              - name: secondaryCtaLabel
                label: Secondary CTA label
                type: string
                required: false
              - name: secondaryCtaUrl
                label: Secondary CTA URL
                type: string
                required: false
              - name: carouselImages
                label: Carousel images
                type: image
                list: true
                required: false
          - name: capabilities
            type: object
            fields:
              - name: backgroundImage
                label: Background image
                type: image
                required: true
              - name: heading
                type: string
                required: true
              - name: description
                type: text
                required: true
              - name: images
                type: image
                list: true
                required: true

      - name: systemIntegration
        label: System Integration
        type: file
        path: src/data/cms/system-integration.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: hero
            type: object
            fields: *split_hero_fields
          - name: strategicPillars
            label: Strategic pillars
            type: object
            fields:
              - name: backgroundImage
                type: image
                required: true
              - name: centerImage
                type: image
                required: true
              - name: heading
                type: string
                required: true
          - name: partnerEcosystem
            label: Partner ecosystem
            type: object
            fields:
              - name: tabs
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{title}'
                fields: &partner_tab_fields
                  - name: title
                    type: string
                    required: true
                  - name: subtitle
                    type: string
                    required: true
                  - name: description
                    type: text
                    required: true
                  - name: partners
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: '{name}'
                    fields:
                      - name: name
                        type: string
                        required: true
                      - name: logo
                        type: image
                        required: false
          - name: execution
            type: object
            fields: &execution_fields
              - name: heading
                type: text
                required: true
              - name: pillars
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{title}'
                fields:
                  - name: iconName
                    label: Icon
                    type: select
                    required: true
                    options:
                      values: [Code, Network, RadioTower, Server, Users]
                  - name: title
                    type: text
                    required: true
                  - name: description
                    type: text
                    required: true
                  - name: url
                    type: string
                    required: false
                  - name: ariaLabel
                    label: ARIA label
                    type: string
                    required: false
          - name: deployments
            type: object
            fields:
              - name: heading
                type: string
                required: true
              - name: image
                type: image
                required: true
              - name: imageAlt
                label: Image alt
                type: string
                required: true
              - name: featured
                type: object
                fields: &case_study_fields
                  - name: title
                    type: string
                    required: true
                  - name: description
                    type: text
                    required: false
                  - name: ctaLabel
                    label: CTA label
                    type: string
                    required: true
                  - name: ctaUrl
                    label: CTA URL
                    type: string
                    required: true
              - name: items
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{title}'
                fields: *case_study_fields

      - name: software
        label: Software
        type: file
        path: src/data/cms/software.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: hero
            type: object
            fields: *split_hero_fields
          - name: portfolio
            type: object
            fields:
              - name: backgroundImage
                type: image
                required: true
              - name: heading
                type: string
                required: true
              - name: description
                type: text
                required: true
              - name: capabilities
                label: Portfolio tabs
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{label}'
                fields:
                  - name: id
                    type: string
                    required: true
                  - name: label
                    type: string
                    required: true
                  - name: shortLabel
                    label: Short label
                    type: string
                    required: false
                  - name: description
                    type: text
                    required: true
                  - name: items
                    label: Portfolio items
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: '{title}'
                    fields:
                      - name: title
                        type: string
                        required: true
                      - name: desc
                        label: Description
                        type: text
                        required: true
                      - name: image
                        type: image
                        required: true
                      - name: ctaLabel
                        label: CTA label
                        type: string
                        required: false
                      - name: ctaUrl
                        label: CTA URL
                        type: string
                        required: false
          - name: execution
            type: object
            fields: *execution_fields
          - name: caseStudies
            label: Case studies
            type: object
            fields:
              - name: heading
                type: string
                required: true
              - name: items
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{title}'
                fields:
                  - name: title
                    type: string
                    required: true
                  - name: solution
                    type: text
                    required: true
                  - name: impact
                    type: text
                    required: true
                  - name: image
                    type: image
                    required: true
                  - name: url
                    label: URL
                    type: string
                    required: false

      - name: resourcing
        label: Resourcing
        type: file
        path: src/data/cms/resourcing.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: hero
            type: object
            fields: *split_hero_fields
          - name: capabilities
            type: object
            fields:
              - name: backgroundImage
                type: image
                required: true
              - name: heading
                type: string
                required: true
              - name: description
                type: text
                required: true
              - name: items
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{title}'
                fields:
                  - name: iconName
                    label: Icon
                    type: select
                    required: true
                    options:
                      values:
                        [
                          Briefcase,
                          Cctv,
                          Cloud,
                          Monitor,
                          Network,
                          Server,
                          ShieldCheck,
                          UserPlus,
                        ]
                  - name: title
                    type: string
                    required: true
                  - name: desc
                    label: Description
                    type: text
                    required: true
                  - name: colSpan
                    label: Span two desktop columns
                    type: boolean
                    required: false

      - name: jobs
        label: Jobs
        type: file
        path: src/data/cms/jobs.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: api
            label: API endpoints
            type: object
            fields:
              - name: jobListEndpoint
                label: Job list endpoint
                type: string
                required: true
              - name: jobDetailEndpoint
                label: Job detail endpoint
                type: string
                required: true
